<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-1401 · Air Liquide case · Research Dep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2; --panel:#ffffff; --ink:#111214; --muted:#6b6f75; --line:#e4e4e0; --soft:#f0f0ed;
  --view:#16181b; --accent:#3d9bff; --good:#1f9d6a; --bad:#c2413b;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num,.mono{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:620px}
/* top bar */
.top{display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:34px;padding:0 9px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.02em;white-space:nowrap}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-left:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:9px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.tab .k{opacity:.55;margin-right:6px;font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:0;background:transparent;padding:7px 10px;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 460px;min-height:0}
.viewer{position:relative;background:radial-gradient(120% 90% at 50% 20%,#262a2f 0%,#16181b 60%,#101113 100%);min-height:0;overflow:hidden}
#c{display:block;width:100%;height:100%;cursor:grab}
#c:active{cursor:grabbing}
.vtitle{position:absolute;left:18px;top:16px;color:#fff;pointer-events:none;max-width:60%}
.vtitle .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9aa3ad}
.vtitle h2{margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.hint{position:absolute;right:16px;top:16px;color:#8d96a0;font-size:12px;pointer-events:none;text-align:right}
.toolbar{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;pointer-events:none}
.grp{pointer-events:auto;display:flex;gap:2px;background:rgba(20,22,25,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:3px}
.grp button{border:0;background:transparent;color:#c9d0d7;font:inherit;font-size:12px;font-weight:500;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.grp button:hover{background:rgba(255,255,255,.08);color:#fff}
.grp button.on{background:#fff;color:#111}
.slider{pointer-events:auto;background:rgba(20,22,25,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:9px 12px;color:#dfe5ea;font-size:12px;min-width:300px;flex:1;max-width:460px}
.slider .row{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.slider b{color:#fff;font-weight:600}
.slider input{width:100%;accent-color:#fff}
.legend{pointer-events:none;position:absolute;right:16px;top:44px;display:flex;flex-direction:column;gap:5px;color:#b9c1c9;font-size:11.5px;background:rgba(20,22,25,.6);padding:8px 10px;border-radius:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.cycle{position:absolute;left:16px;top:74px;width:272px;background:rgba(20,22,25,.84);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:12px 14px;color:#cfd6dc;font-size:12px;pointer-events:none}
.cycle .ct{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8d96a0;font-weight:600}
.cycle .cph{color:#fff;font-weight:600;font-size:13.5px;margin:3px 0 10px}
.gauge .gl{display:flex;justify-content:space-between;margin-bottom:5px}.gauge .gl b{color:#fff;font-variant-numeric:tabular-nums}
.gauge .gt{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:visible}
.gauge .gf{height:100%;border-radius:5px;background:#e9eef2;transition:width .15s linear}
.gauge .gt i{position:absolute;top:-3px;width:2px;height:14px;background:#fff;opacity:.7}
.gauge .gm{display:flex;gap:12px;margin-top:5px;font-size:10.5px;color:#8d96a0}.gauge .gm span{white-space:nowrap}
.cs{list-style:none;counter-reset:c;margin:10px 0 0;padding:0}
.cs li{counter-increment:c;position:relative;font-size:11.5px;line-height:1.35;padding:3px 0 3px 24px;color:#7f8892;transition:color .2s}
.cs li::before{content:counter(c);position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.08);font-size:10px;font-weight:700;display:grid;place-items:center}
.cs li.done{color:#aeb6be}.cs li.done::before{content:"✓";background:rgba(255,255,255,.18)}
.cs li.on{color:#fff}.cs li.on::before{background:#3d9bff;color:#fff}
.cbin{margin-top:8px;font-size:11px;color:#8d96a0;border-top:1px solid rgba(255,255,255,.08);padding-top:7px}
@media (max-width:1100px){.cycle{display:none!important}}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:11.5px;font-weight:500;color:#e9eef2;padding:3px 8px;border-radius:7px;background:rgba(18,20,23,.85);border:1px solid rgba(255,255,255,.12);transition:opacity .2s}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:rgba(255,255,255,.35)}
.lbl::before{content:"";position:absolute;left:calc(50% - 3px);top:calc(100% + 13px);width:7px;height:7px;border-radius:50%;background:#fff}
.lbl.new{background:var(--accent);border-color:var(--accent);color:#fff}
.lbl.new::before{background:var(--accent)}
.lbl.bad{background:#c2413b;border-color:#c2413b;color:#fff}.lbl.bad::before{background:#ff6b5e}
.tab.rej:not(.on) .k{color:#c2413b;opacity:1}
.cs li.on.bad::before{background:#c2413b}
.lbl{margin-top:-18px}
/* panel */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0}
.pin{padding:22px 24px 40px}
.eyebrow2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pin h3{font-size:22px;line-height:1.2;margin:6px 0 6px;letter-spacing:-.015em}
.lead{color:#3c4045;margin:0 0 18px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 22px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
.kpi .v{font-size:21px;font-weight:700;letter-spacing:-.02em}
.kpi .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .l{font-size:12px;color:var(--muted);line-height:1.35}
.kpi.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.dark .l,.kpi.dark .v small{color:#aab1b8}
h4{font-size:13px;margin:22px 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
h4::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
td.src{color:var(--muted);font-size:11.5px}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:right}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:0 0 10px 34px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--soft);font-size:12px;font-weight:700;display:grid;place-items:center}
.ben{display:grid;gap:8px}
.ben div{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:var(--soft)}
.ben b{font-size:15px;white-space:nowrap}
.ben span{color:#3c4045;font-size:12.5px}
.calc{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:8px}
.calc label{display:flex;justify-content:space-between;font-size:12.5px;color:#3c4045;margin:4px 0}
.calc label b{color:var(--ink)}
.calc input[type=range]{width:100%;accent-color:#111;margin:2px 0 10px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.res div{background:var(--soft);border-radius:10px;padding:9px 11px}
.res .v{font-size:18px;font-weight:700}
.res .l{font-size:11.5px;color:var(--muted)}
.formula{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;color:#3c4045;background:#fafaf8;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.6;white-space:pre-wrap}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.risk{border-left:3px solid var(--ink);padding:6px 0 6px 12px;color:#3c4045;font-size:12.5px;margin:8px 0}
.chart{margin-top:6px}
.chart .bar{display:grid;grid-template-columns:150px 1fr 54px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.chart .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.chart .fill{height:100%;background:var(--ink);border-radius:6px}
.chart .fill.g{background:#9aa0a6}
.chart .fill.a{background:var(--accent)}
.foot{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:26px;padding-top:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--soft);color:#3c4045;margin-right:4px}
.render .top,.render .panel,.render .toolbar,.render .legend,.render .hint,.render .cycle,.render .vtitle{display:none!important}
.render .app{grid-template-rows:1fr}.render .main{grid-template-columns:1fr}
@media (max-width:1100px){
  .main{grid-template-columns:1fr;grid-template-rows:58vh auto}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .top{flex-wrap:wrap}.tabs{margin-left:0;order:3;width:100%;overflow:auto}
  .brand p{display:none}
}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">A-1401</div><div><h1 id="t-title"></h1><p id="t-sub"></p></div></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
  </header>
  <main class="main">
    <section class="viewer">
      <canvas id="c"></canvas>
      <div id="labels"></div>
      <div class="vtitle"><div class="eyebrow" id="v-eyebrow"></div><h2 id="v-title"></h2></div>
      <div class="hint" id="v-hint"></div>
      <div class="cycle" id="cycle"></div>
      <div class="legend" id="legend"></div>
      <div class="toolbar">
        <div class="grp" id="views"></div>
        <div class="grp" id="toggles"></div>
        <div class="slider" id="slider"></div>
      </div>
    </section>
    <aside class="panel"><div class="pin" id="panel"></div></aside>
  </main>
</div>

    <h3>${e?"\u041F\u043E\u0447\u0435\u043C\u0443 \u0444\u0438\u043B\u044C\u0442\u0440 \u043F\u0440\u044F\u043C\u043E \u043F\u043E\u0434 \u0432\u0435\u043D\u0442\u0438\u043B\u044F\u0442\u043E\u0440\u043E\u043C \u043D\u0435 \u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0442":"Why a filter right under the fan does not work"}</h3>
    <p class="lead">${e?"\u0421\u0430\u043C\u0430\u044F \u043E\u0447\u0435\u0432\u0438\u0434\u043D\u0430\u044F \u0438\u0434\u0435\u044F \u2014 \u043F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C \u0441\u0435\u0442\u043A\u0443 \u0432\u043F\u043B\u043E\u0442\u043D\u0443\u044E \u043F\u043E\u0434 \u043A\u0430\u0436\u0434\u044B\u043C \u0432\u0435\u043D\u0442\u0438\u043B\u044F\u0442\u043E\u0440\u043E\u043C. Air Liquide \u0435\u0451 \u0443\u0436\u0435 \u0440\u0430\u0441\u0441\u043C\u0430\u0442\u0440\u0438\u0432\u0430\u043B\u0430 \u0438 \u043E\u0442\u043A\u0430\u0437\u0430\u043B\u0430\u0441\u044C: \u0444\u0438\u0437\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0430 \u0444\u0438\u043B\u044C\u0442\u0440\u0430 \u0432\u0431\u043B\u0438\u0437\u0438 \u043D\u0435\u0432\u043E\u0437\u043C\u043E\u0436\u043D\u0430, \u0442\u0430\u043A \u043A\u0430\u043A \u0441\u043E\u0437\u0434\u0430\u0451\u0442 \u0440\u0430\u0437\u0440\u0435\u0436\u0435\u043D\u0438\u0435 \u043C\u0435\u0436\u0434\u0443 \u0444\u0438\u043B\u044C\u0442\u0440\u043E\u043C \u0438 \u043B\u043E\u043F\u0430\u0441\u0442\u044F\u043C\u0438. \u041D\u0435 \u0441\u0440\u0430\u0437\u0443, \u0430 \u043F\u043E\u0441\u0442\u0435\u043F\u0435\u043D\u043D\u043E, \u043F\u043E \u043C\u0435\u0440\u0435 \u0437\u0430\u0433\u0440\u044F\u0437\u043D\u0435\u043D\u0438\u044F \u0444\u0438\u043B\u044C\u0442\u0440\u0430: \u0440\u0430\u0441\u0442\u0451\u0442 \u043F\u0435\u0440\u0435\u043F\u0430\u0434, \u0438 \u044D\u0442\u043E \u0441\u043D\u0438\u0436\u0430\u0435\u0442 \u041A\u041F\u0414 \u0445\u043E\u043B\u043E\u0434\u0438\u043B\u044C\u043D\u0438\u043A\u0430.":"The obvious idea is a mesh fixed right under each fan. Air Liquide has already considered and rejected it: a filter that close creates negative pressure between the filter and the blades. Not at once but gradually, as the filter fouls: the pressure drop grows and cooler efficiency falls."}</p>

    <h4>${e?"\u0427\u0442\u043E \u043F\u0440\u043E\u0438\u0441\u0445\u043E\u0434\u0438\u0442":"What happens"}</h4>
    <ol class="steps">
      <li>${e?"\u0412\u0441\u044F \u0441\u0442\u0440\u0443\u044F \u0432\u0435\u043D\u0442\u0438\u043B\u044F\u0442\u043E\u0440\u0430 \u0438\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u043C\u0430\u043B\u0435\u043D\u044C\u043A\u0443\u044E \u043F\u043B\u043E\u0449\u0430\u0434\u044C \u2014 4,5 \u043C\xB2 \u043D\u0430 \u0432\u0435\u043D\u0442\u0438\u043B\u044F\u0442\u043E\u0440, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C 7 \u043C/\u0441 \u0438 \u0441\u043E\u043F\u0440\u043E\u0442\u0438\u0432\u043B\u0435\u043D\u0438\u0435 \u0432\u044B\u0441\u043E\u043A\u043E\u0435 \u0441 \u043F\u0435\u0440\u0432\u043E\u0433\u043E \u0434\u043D\u044F.":"The whole fan flow goes through a small area \u2014 4.5 m\xB2 per fan \u2014 so velocity is 7 m/s and resistance is high from day one."}</li>
      <li>${e?"\u041F\u0443\u0445 \u043B\u043E\u0436\u0438\u0442\u0441\u044F \u043D\u0430 \u0444\u0438\u043B\u044C\u0442\u0440. \u041F\u0435\u0440\u0435\u043F\u0430\u0434 \u0440\u0430\u0441\u0442\u0451\u0442 \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u0438\u0447\u043D\u043E \u0441\u043E \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C\u044E \u0432 \u043E\u0442\u043A\u0440\u044B\u0442\u044B\u0445 \u044F\u0447\u0435\u0439\u043A\u0430\u0445: 22 \u2192 150 \u041F\u0430.":"Fluff settles on the filter. The drop grows with the square of the velocity through the open cells: 22 \u2192 150 Pa."}</li>
      <li>${e?"\u041C\u0435\u0436\u0434\u0443 \u0444\u0438\u043B\u044C\u0442\u0440\u043E\u043C \u0438 \u043B\u043E\u043F\u0430\u0441\u0442\u044F\u043C\u0438 \u0432\u043E\u0437\u043D\u0438\u043A\u0430\u0435\u0442 \u0440\u0430\u0437\u0440\u0435\u0436\u0435\u043D\u0438\u0435 \u2014 \u0432\u0435\u043D\u0442\u0438\u043B\u044F\u0442\u043E\u0440 \u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0442 \xAB\u043D\u0430 \u043F\u0440\u0438\u0441\u043E\u0441\xBB, \u0435\u0433\u043E \u0440\u0430\u0431\u043E\u0447\u0430\u044F \u0442\u043E\u0447\u043A\u0430 \u0443\u0445\u043E\u0434\u0438\u0442, \u0440\u0430\u0441\u0445\u043E\u0434 \u0432\u043E\u0437\u0434\u0443\u0445\u0430 \u043F\u0430\u0434\u0430\u0435\u0442.":"Negative pressure forms between the filter and the blades \u2014 the fan works against suction, its operating point shifts and airflow falls."}</li>
      <li>${e?"\u041C\u0435\u043D\u044C\u0448\u0435 \u0432\u043E\u0437\u0434\u0443\u0445\u0430 \u2014 \u043C\u0435\u043D\u044C\u0448\u0435 UA: \u043B\u0435\u0442\u043E\u043C \u0430\u043F\u043F\u0430\u0440\u0430\u0442 \u0443\u043F\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u0432 \u043F\u0440\u0435\u0434\u0435\u043B \u0435\u0449\u0451 \u0440\u0430\u043D\u044C\u0448\u0435, \u0447\u0435\u043C \u0441\u0435\u0439\u0447\u0430\u0441.":"Less air means lower UA: in summer the cooler hits its limit even sooner than today."}</li>
      <li>${e?"\u0427\u0438\u0441\u0442\u0438\u0442\u044C \u0444\u0438\u043B\u044C\u0442\u0440 \u043D\u0430 \u0445\u043E\u0434\u0443 \u043D\u0435\u0433\u0434\u0435: \u043E\u043D \u0432\u043F\u043B\u043E\u0442\u043D\u0443\u044E \u043A \u0432\u0440\u0430\u0449\u0430\u044E\u0449\u0438\u043C\u0441\u044F \u043B\u043E\u043F\u0430\u0441\u0442\u044F\u043C. \u0422\u043E\u043B\u044C\u043A\u043E \u043E\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0430 \u0432\u0435\u043D\u0442\u0438\u043B\u044F\u0442\u043E\u0440\u0430.":"There is no room to clean it while running: it sits right at the rotating blades. Only a fan stop."}</li>
    </ol>
